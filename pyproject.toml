[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v3-longcontext-release"
version = "0.1.0"
description = "Deterministic long-context process rewards and data-pipeline release artifacts"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["rl*", "eval*"]

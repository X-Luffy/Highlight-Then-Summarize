[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2s-longcontext-release"
version = "0.1.0"
description = "Highlight-Then-Summarize long-context training, rewards, and evaluation"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["rl*", "eval*", "sft*"]

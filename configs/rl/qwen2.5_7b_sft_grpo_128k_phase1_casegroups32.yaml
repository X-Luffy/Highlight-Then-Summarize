rlhf_type: grpo
model: __SET_FROM_SFT_CHECKPOINT_BY_LAUNCHER__
train_type: full
template: qwen

dataset:
  - data/rl_swift_train_128k.jsonl
external_plugins:
  - rl/longtext_reward_v3_swift.py
reward_funcs:
  - longtext_reward_v3

# 126,976 prompt tokens + up to 8,192 completion tokens = the same 135,168
# total-token budget used for SFT. Longer records are deferred, not truncated.
max_length: 135168
max_completion_length: 8192
truncation_strategy: delete
attn_impl: flash_attn
padding_free: true
enable_thinking: false

# Keep the 128K micro-batch at one sample per GPU. Eight generation/training
# micro-steps form a 256-sample generation batch: 32 prompt groups x 8 samples.
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
generation_batch_size: 256
num_train_epochs: 1
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
torch_dtype: bfloat16
gradient_checkpointing: true
deepspeed: zero3

num_generations: 8
temperature: 1.0
top_p: 1.0
top_k: 0
num_iterations: 1
beta: 0.0
scale_rewards: group
log_completions: true

split_dataset_ratio: 0
strict: true
remove_unused_columns: false
dataset_num_proc: 8
load_from_cache_file: true
dataset_shuffle: true
data_seed: 42
seed: 42
dataloader_num_workers: 2

output_dir: __SET_FROM_RL_OUTPUT_DIR_BY_LAUNCHER__
logging_dir: __SET_FROM_RL_OUTPUT_DIR_BY_LAUNCHER__/tensorboard
add_version: false
logging_steps: 1
save_strategy: steps
save_steps: 25
save_total_limit: 2
report_to:
  - tensorboard
overwrite_output_dir: false
ddp_timeout: 18000000
ddp_backend: nccl

rlhf_type: grpo
model: __SET_FROM_SFT_CHECKPOINT_BY_LAUNCHER__
train_type: full
template: qwen
dataset:
  - data/rl_v1_bucket_64k.jsonl
external_plugins:
  - rl/longtext_reward_v3_swift.py
reward_funcs: [longtext_reward_v3]
max_length: 67584
max_completion_length: 2048
truncation_strategy: delete
attn_impl: flash_attn
padding_free: true
enable_thinking: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
generation_batch_size: 128
num_generations: 8
num_train_epochs: 1
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
torch_dtype: bfloat16
gradient_checkpointing: true
deepspeed: zero3
temperature: 1.0
top_p: 1.0
top_k: 0
num_iterations: 1
beta: 0.0
scale_rewards: group
log_completions: true
split_dataset_ratio: 0
strict: true
remove_unused_columns: false
dataset_num_proc: 8
load_from_cache_file: true
dataset_shuffle: false
data_seed: 42
seed: 42
dataloader_num_workers: 2
output_dir: __SET_FROM_RL_OUTPUT_DIR_BY_LAUNCHER__
logging_dir: __SET_FROM_RL_OUTPUT_DIR_BY_LAUNCHER__/tensorboard
add_version: false
logging_steps: 1
save_strategy: epoch
save_steps: 25
save_total_limit: 2
report_to: [tensorboard]
overwrite_output_dir: false
ddp_timeout: 18000000
ddp_backend: nccl
